<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glukky — 為忙碌的子女而設</title>
  <meta name="description" content="每天自動追蹤血糖數據，讓父母更關注健康。有異常立即通知你，不用天天打電話確認。" />
  <meta property="og:title" content="Glukky — 工作再忙，他們的健康不必等你" />
  <meta property="og:description" content="每天自動追蹤血糖數據，讓父母更關注健康。有異常立即通知你，不用天天打電話確認。" />
  <meta property="og:image" content="images/screen1.png" />
  <script src="https://waitlister.me/js/embed.js" defer></script>
  <style>
    /* ── Tokens ───────────────────────────────────────── */
    :root {
      --bg:           #fdfbee;
      --bg-soft:      #f7f5e6;
      --bg-card:      #ffffff;
      --fg:           #214B36;
      --fg-soft:      #345a47;
      --muted:        #6E8477;
      --border:       #d8e8d4;
      --primary:      hsl(166 48% 35%);
      --primary-dark: #214B36;
      --primary-soft: #eef9d7;
      --chip:         #d0f38f;
      --accent:       hsl(38 78% 56%);
      --shadow:       0 4px 20px rgba(44,72,56,0.08);
      --shadow-lg:    0 8px 40px rgba(44,72,56,0.12);
      --radius:       16px;
      --radius-lg:    24px;
      --radius-pill:  999px;
      --font: 'PingFang TC','Microsoft JhengHei','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --max: 1080px;
    }

    /* ── Reset ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: var(--primary); text-decoration: none; }

    /* ── Layout helpers ───────────────────────────────── */
    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
    }
    section { padding: 72px 0; }

    /* ── Nav ──────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(253,251,238,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo img {
      height: 34px;
      width: auto;
    }
    .nav-logo-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.3px;
    }

    /* ── Hero ─────────────────────────────────────────── */
    .hero {
      padding: 88px 0 80px;
      text-align: center;
      background: linear-gradient(160deg, #fdfbee 0%, #f0f8e8 100%);
    }
    .hero-eyebrow {
      display: inline-block;
      background: var(--chip);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }
    .hero h1 {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      color: var(--fg);
      line-height: 1.25;
      letter-spacing: -0.5px;
      max-width: 680px;
      margin: 0 auto 24px;
    }
    .hero-subtitle {
      font-size: clamp(15px, 2.5vw, 18px);
      color: var(--fg-soft);
      max-width: 480px;
      margin: 0 auto 40px;
      line-height: 1.8;
    }
    .hero-subtitle p + p { margin-top: 6px; }
    .btn-cta {
      display: inline-block;
      background: var(--primary-dark);
      color: #fff;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 16px rgba(33,75,54,0.25);
      text-decoration: none;
    }
    .btn-cta:hover {
      background: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(33,75,54,0.3);
    }
    .btn-cta:active { transform: translateY(0); }
    .wl-hint {
      margin-top: 14px;
      font-size: 14px;
      color: var(--fg-soft);
    }
    .hero-embed {
      margin-top: 32px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Feature rows ─────────────────────────────────── */
    .features { background: var(--bg); }
    .feature-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      padding: 56px 0;
      border-bottom: 1px solid var(--border);
    }
    .feature-row:last-child { border-bottom: none; }
    .feature-row.reverse { direction: rtl; }
    .feature-row.reverse > * { direction: ltr; }
    .feature-number {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .feature-text h2 {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 800;
      line-height: 1.4;
      color: var(--fg);
      letter-spacing: -0.3px;
    }
    .feature-screenshot {
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      position: relative;
      display: inline-block;
    }
    .phone-frame img {
      width: 220px;
      border-radius: 32px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(0,0,0,0.06);
    }

    /* ── Trust strip ──────────────────────────────────── */
    .trust {
      background: var(--primary-soft);
      padding: 48px 0;
      text-align: center;
    }
    .trust-inner {
      max-width: 600px;
      margin: 0 auto;
    }
    .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 10px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .trust-badge svg { flex-shrink: 0; }
    .trust-badge-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
    }
    .trust p {
      font-size: 16px;
      color: var(--fg-soft);
      line-height: 1.6;
    }

    /* ── Signup block ─────────────────────────────────── */
    .signup {
      background: var(--fg);
      padding: 80px 0;
      text-align: center;
    }
    .signup h2 {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
    }
    .signup p {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 36px;
    }
    .btn-waitlist {
      display: inline-block;
      background: var(--chip);
      color: var(--fg);
      font-family: var(--font);
      font-size: 17px;
      font-weight: 800;
      padding: 16px 44px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      letter-spacing: -0.2px;
      text-decoration: none;
    }
    .btn-waitlist:hover {
      background: #c8ee80;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .btn-waitlist:active { transform: translateY(0); }

    /* ── Footer ───────────────────────────────────────── */
    footer {
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      padding: 28px 0;
      text-align: center;
    }
    footer p {
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Mobile ───────────────────────────────────────── */
    @media (max-width: 700px) {
      section { padding: 52px 0; }
      .hero { padding: 60px 0 52px; }

      .feature-row {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 40px 0;
      }
      .feature-row.reverse { direction: ltr; }
      .phone-frame img { width: 180px; }

      .signup { padding: 56px 0; }
    }
  </style>
</head>
<body>

  <!-- ── Nav ── -->
  <nav>
    <div class="nav-inner">
      <span class="nav-logo">
        <img src="images/logo.png" alt="Glukky" width="34" height="34" />
        <span class="nav-logo-name">Glukky</span>
      </span>
    </div>
  </nav>

  <!-- ── Hero ── -->
  <section class="hero" id="waitlist-section">
    <div class="container">
      <div class="hero-eyebrow">為忙碌的子女而設</div>
      <h1>工作再忙，<br>他們的健康不必等你</h1>
      <div class="hero-subtitle">
        <p>每天自動追蹤血糖數據，讓父母更關注健康</p>
        <p>有異常立即通知你，不用天天打電話確認</p>
      </div>
      <button
        type="button"
        class="btn-cta"
        onclick="document.getElementById('wl-hint').style.display='block'"
      >加入早鳥名單</button>
      <p id="wl-hint" class="wl-hint" style="display:none">請在下方輸入您的電子郵件。如果表格未顯示，請再次刷新。</p>
      <div class="hero-embed">
        <div class="waitlister-form" data-waitlist-key="AbGYSXkxZa64" data-height="400px"></div>
      </div>
    </div>
  </section>

  <!-- ── Feature rows ── -->
  <section class="features">
    <div class="container">

      <div class="feature-row">
        <div class="feature-text">
          <div class="feature-number">01</div>
          <h2>爸媽總說「我很好」，<br>但數據會告訴你真相</h2>
        </div>
        <div class="feature-screenshot">
          <div class="phone-frame">
            <img src="images/screen1.png" alt="Glukky 每日健康追蹤畫面" loading="lazy" />
          </div>
        </div>
      </div>

      <div class="feature-row reverse">
        <div class="feature-text">
          <div class="feature-number">02</div>
          <h2>送給爸媽最實用的禮物，<br>不是保健品，是安心</h2>
        </div>
        <div class="feature-screenshot">
          <div class="phone-frame">
            <img src="images/screen2.png" alt="Glukky 健康資訊與飲食建議畫面" loading="lazy" />
          </div>
        </div>
      </div>

      <div class="feature-row">
        <div class="feature-text">
          <div class="feature-number">03</div>
          <h2>讓他們知道，你一直都在關心他們，<br>即使你很忙</h2>
        </div>
        <div class="feature-screenshot">
          <div class="phone-frame">
            <img src="images/screen3.png" alt="Glukky 食物快拍與即時建議畫面" loading="lazy" />
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ── Trust strip ── -->
  <section class="trust">
    <div class="container">
      <div class="trust-inner">
        <div class="trust-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#214B36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span class="trust-badge-text">來自 Glukky 團隊</span>
        </div>
        <p>已協助許多家庭管理糖尿病，<br>讓照顧者安心，讓長輩更自主。</p>
      </div>
    </div>
  </section>

  <!-- ── Signup ── -->
  <section class="signup" id="signup">
    <div class="container">
      <h2>加入早鳥名單</h2>
      <p>產品上線時，你將是第一個知道的人</p>
      <a href="#waitlist-section" class="btn-waitlist">加入早鳥名單</a>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <div class="container">
      <p>我們不會分享您的電子郵件，僅用於通知產品上線</p>
    </div>
  </footer>

</body>
</html>
