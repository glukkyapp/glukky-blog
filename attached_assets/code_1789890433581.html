<span class="font-label-md text-label-md text-on-surface-variant">9月19日 下午 12:19</span>
</div>
<button aria-label="切換字體大小" class="flex items-center justify-center min-w-[56px] min-h-[56px] px-space-xs rounded-xl bg-surface-container hover:bg-surface-container-high text-primary font-bold active:scale-95 transition-transform" id="fontScaleBtn" type="button">

<div class="flex items-center justify-between mb-space-sm">

<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-surface-container-high text-primary font-label-md text-label-md font-semibold">
<span class="material-symbols-outlined text-[18px]">verified</span>
<span class="">mmol/L</span>
</span>

<span class="material-symbols-outlined text-[36px] font-bold">remove</span>
</button>
<div class="flex flex-col items-center justify-center flex-1 py-1">
<div class="flex items-baseline justify-center">
<span class="font-display-lg text-display-lg text-primary font-extrabold tracking-tight select-none" id="glucoseValueDisplay">10.2</span>
<span class="ml-2 font-label-lg text-label-lg text-on-surface-variant font-bold">mmol/L</span>
</div>
</div>
<button aria-label="增加 0.1" class="flex items-center justify-center min-w-[64px] min-h-[64px] rounded-2xl bg-surface-container hover:bg-surface-container-high text-primary active:scale-90 transition-all shadow-sm" id="btnPlus" type="button">
<span class="material-symbols-outlined text-[36px] font-bold">add</span>
</button>
</div>

<div class="mt-4 pt-3">
<div class="flex items-center justify-between mb-2">
<span class="font-label-md text-label-md text-on-surface-variant font-medium">快速調整小數點 (0.0 - 0.9)</span>
<span class="font-label-md text-label-md text-primary font-semibold">輕觸即改</span>
</div>
<div aria-label="小數點快捷鍵" class="grid grid-cols-5 gap-2" role="group">
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="0" type="button">.0</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="1" type="button">.1</button>
<button class="decimal-btn active-decimal min-h-[48px] rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-bold shadow transition-all active:scale-95" data-decimal="2" type="button">.2</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="3" type="button">.3</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="4" type="button">.4</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="5" type="button">.5</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="6" type="button">.6</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="7" type="button">.7</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="8" type="button">.8</button>
<button class="decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95" data-decimal="9" type="button">.9</button>
</div>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-[0_4px_16px_rgba(30,58,95,0.06)] mb-space-md">
<span class="block font-label-md text-label-md font-bold text-on-surface mb-2">測量狀態與日常備註</span>
<div aria-label="快捷標籤" class="flex flex-wrap gap-2 mb-3" role="group">
<button class="tag-chip active-tag flex items-center gap-1.5 min-h-[48px] px-3.5 rounded-xl bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">medication</span>
<span class="">服藥後</span>
</button>
<button class="tag-chip active-tag flex items-center gap-1.5 min-h-[48px] px-3.5 rounded-xl bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">sentiment_satisfied</span>
<span class="">感覺良好</span>
</button>
<button class="tag-chip flex items-center gap-1.5 min-h-[48px] px-3.5 rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">sick</span>
<span class="">輕微頭暈</span>
</button>
<button class="tag-chip flex items-center gap-1.5 min-h-[48px] px-3.5 rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">dinner_dining</span>
<span class="">剛吃完大餐</span>
</button>
</div>
<div class="relative">
<textarea class="w-full p-3.5 rounded-xl bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container focus:text-on-surface resize-none transition-colors" id="noteInput" placeholder="備註（選填）：例如今日飲咗甜湯、運動了30分鐘..." rows="2"></textarea>
</div>
</div>
<div class="mb-space-md">
<button class="w-full flex items-center justify-center gap-2 min-h-[56px] py-3 px-space-md rounded-2xl bg-primary text-on-primary font-headline-md text-headline-md font-bold shadow-lg hover:opacity-95 active:scale-98 transition-all" id="saveGlucoseBtn" type="button">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
<span class="">儲存血糖記錄</span>
</button>
</div>
<div class="flex items-center justify-center gap-2 p-space-sm rounded-xl bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[22px] shrink-0 text-primary">health_and_safety</span>
<p class="font-label-md text-label-md leading-relaxed text-center">
      血糖水平受飲食、情緒及活動等多種因素影響。如有不適，請及時諮詢家庭醫生。
    </p>
</div>
</div>
<script>
  (function() {
    let glucose = 10.2;
    let timing = 'postmeal';
    const displayEl = document.getElementById('glucoseValueDisplay');
    const badgeEl = document.getElementById('statusBadge');
    const pointerEl = document.getElementById('rangeIndicatorPointer');
    const adviceBoxEl = document.getElementById('healthAdviceBox');
    const btnMinus = document.getElementById('btnMinus');
    const btnPlus = document.getElementById('btnPlus');
    const decimalBtns = document.querySelectorAll('.decimal-btn');
    const timingChips = document.querySelectorAll('.meal-timing-chip');
    const tagChips = document.querySelectorAll('.tag-chip');
    const saveBtn = document.getElementById('saveGlucoseBtn');

    function updateUI() {
      displayEl.textContent = glucose.toFixed(1);
      const dec = Math.round((glucose - Math.floor(glucose)) * 10);
      decimalBtns.forEach(btn => {
        const d = parseInt(btn.getAttribute('data-decimal'), 10);
        if (d === dec) {
          btn.className = "decimal-btn active-decimal min-h-[48px] rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-bold shadow transition-all active:scale-95";
        } else {
          btn.className = "decimal-btn min-h-[48px] rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg font-bold transition-all active:scale-95";
        }
      });

      let percent = Math.min(Math.max(((glucose - 3.0) / 11.0) * 100, 4), 96);
      pointerEl.style.left = percent + '%';

      if (timing === 'fasting') {
        if (glucose < 3.9) {
          badgeEl.textContent = '偏低';
          badgeEl.className = 'font-bold text-tertiary';
          adviceBoxEl.innerHTML = '<span class="material-symbols-outlined text-tertiary text-[24px] mt-0.5">warning</span><p class="font-body-md text-body-md text-on-surface leading-snug">空腹血糖偏低，可適當含一粒糖果或半杯果汁，稍後復測。</p>';
        } else if (glucose <= 6.1) {
          badgeEl.textContent = '理想正常';
          badgeEl.className = 'font-bold text-primary';
          adviceBoxEl.innerHTML = '<span class="material-symbols-outlined text-primary text-[24px] mt-0.5" style="font-variation-settings: \'FILL\' 1;">check_circle</span><p class="font-body-md text-body-md text-on-surface leading-snug">空腹數值非常理想！繼續保持良好的飲食作息習慣。</p>';
        } else {
          badgeEl.textContent = '偏高';
          badgeEl.className = 'font-bold text-secondary';
          adviceBoxEl.innerHTML = '<span class="material-symbols-outlined text-secondary text-[24px] mt-0.5">info</span><p class="font-body-md text-body-md text-on-surface leading-snug">早晨空腹偏高，多飲溫水，留意昨晚晚餐澱粉質攝取。</p>';
        }
      } else {
        if (glucose < 4.4) {
          badgeEl.textContent = '偏低';
          badgeEl.className = 'font-bold text-tertiary';
          adviceBoxEl.innerHTML = '<span class="material-symbols-outlined text-tertiary text-[24px] mt-0.5">warning</span><p class="font-body-md text-body-md text-on-surface leading-snug">血糖偏低，請先進食少量餅乾或高纖點心，如有頭暈請坐低休息。</p>';
        } else if (glucose <= 8.5) {
          badgeEl.textContent = '理想標準';
          badgeEl.className = 'font-bold text-primary';
          adviceBoxEl.innerHTML = '<span class="material-symbols-outlined text-primary text-[24px] mt-0.5" style="font-variation-settings: \'FILL\' 1;">check_circle</span><p class="font-body-md text-body-md text-on-surface leading-snug">飯後血糖控制得好好，維持均衡餐盤同散步習慣！</p>';
        } else {
          badgeEl.textContent = '稍微偏高';
          badgeEl.className = 'font-bold text-secondary';
          adviceBoxEl.innerHTML = '<span class="material-symbols-outlined text-secondary text-[24px] mt-0.5">info</span><p class="font-body-md text-body-md text-on-surface leading-snug">飯後數值稍微偏高，多飲溫水放鬆休息下，半小時後再量一次。</p>';
        }
      }
    }

    btnMinus.addEventListener('click', function() {
      if (glucose > 2.0) {
        glucose = Math.round((glucose - 0.1) * 10) / 10;
        updateUI();
      }
    });

    btnPlus.addEventListener('click', function() {
      if (glucose < 25.0) {
        glucose = Math.round((glucose + 0.1) * 10) / 10;
        updateUI();
      }
    });

    decimalBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const decVal = parseInt(this.getAttribute('data-decimal'), 10);
        const intVal = Math.floor(glucose);
        glucose = intVal + (decVal / 10);
        updateUI();
      });
    });

    timingChips.forEach(btn => {
      btn.addEventListener('click', function() {
        timingChips.forEach(c => {
          c.className = "meal-timing-chip flex flex-col items-center justify-center min-h-[58px] py-2 px-1 rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md transition-all active:scale-98";
        });
        this.className = "meal-timing-chip active-timing flex flex-col items-center justify-center min-h-[58px] py-2 px-1 rounded-xl bg-primary text-on-primary font-label-md text-label-md shadow-md transition-all active:scale-98";
        timing = this.getAttribute('data-timing');
        updateUI();
      });
    });

    tagChips.forEach(chip => {
      chip.addEventListener('click', function() {
        const isActive = this.classList.contains('bg-primary');
        if (isActive) {
          this.className = "tag-chip flex items-center gap-1.5 min-h-[48px] px-3.5 rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md transition-all active:scale-95";
        } else {
          this.className = "tag-chip active-tag flex items-center gap-1.5 min-h-[48px] px-3.5 rounded-xl bg-primary text-on-primary font-label-md text-label-md shadow-sm transition-all active:scale-95";
        }
      });
    });

    let scaleIndex = 0;
    const scales = ['100%', '115%', '125%'];
    const fontBtn = document.getElementById('fontScaleBtn');
    fontBtn.addEventListener('click', function() {
      scaleIndex = (scaleIndex + 1) % scales.length;
      document.body.style.zoom = scales[scaleIndex];
    });

    saveBtn.addEventListener('click', function() {
      this.classList.add('scale-95');
      setTimeout(() => {
        this.classList.remove('scale-95');
        alert('血糖記錄已成功儲存：' + glucose.toFixed(1) + ' mmol/L');
      }, 150);
    });

    updateUI();
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(30,58,95,0.06)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-20 px-space-xs"><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[56px] px-space-xs text-on-surface-variant hover:text-primary transition-colors" data-path="home" href="#" style="color: rgb(8, 101, 116);"><span class="material-symbols-outlined text-[28px]">home</span><span class="font-label-md text-label-md leading-none">主頁</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[56px] px-space-xs text-on-surface-variant hover:text-primary transition-colors" data-path="records" href="#"><span class="material-symbols-outlined text-[28px]">assignment</span><span class="font-label-md text-label-md leading-none">記錄</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[56px] px-space-xs text-on-surface-variant hover:text-primary transition-colors" data-path="camera" href="#"><span class="material-symbols-outlined text-[28px]">photo_camera</span><span class="font-label-md text-label-md leading-none">拍照</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[56px] px-space-xs text-on-surface-variant hover:text-primary transition-colors" data-path="trends" href="#"><span class="material-symbols-outlined text-[28px]">monitoring</span><span class="font-label-md text-label-md leading-none">趨勢</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[56px] px-space-xs text-on-surface-variant hover:text-primary transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined text-[28px]">person</span><span class="font-label-md text-label-md leading-none">我的</span></a></div></nav>
