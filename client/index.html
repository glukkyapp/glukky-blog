<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Glukky</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>html,body{background-color:#F3EAE5;margin:0;padding:0;}#root{background-color:#F3EAE5;min-height:100vh;}</style>

    <!-- Warm up the third-party origins we'll touch in the first second. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://us.i.posthog.com">
    <link rel="preconnect" href="https://us-assets.i.posthog.com" crossorigin>

    <!--
      Slimmed Google Fonts: only the families/weights actually used in the app shell.
      - Inter / Karla: heading + body (regular, medium, semibold, bold, extrabold, +italic)
      - Playfair Display: only the .app-page-v2 greeting at weight 700
      Mono uses system Menlo (see --font-mono in index.css), so no Google mono is fetched.
    -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Karla:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Karla:wght@400;700&display=swap"></noscript>

    <!--
      BN dismisses its splash when the page calls nativelyOnLoad(). Fire it
      *immediately* from a tiny inline script so we don't wait for the
      jsdelivr CDN. The real Natively SDK still loads async below for the
      OneSignal/RevenueCat/haptics bridges; nativelyOnLoad is BN's "WebView
      ready" ping, not a "SDK ready" ping. __bnLoadedAt is still stamped so
      the dev-panel ColdLaunchTimingCard keeps working.
    -->
    <script>
      (function(){
        window.__bnLoadedAt = Date.now();
        try { if (typeof nativelyOnLoad === "function") nativelyOnLoad(); } catch(e){}
      })();
      // Stub so anything else that calls nativelyOnLoad() later is a no-op.
      if (typeof nativelyOnLoad === "undefined") { window.nativelyOnLoad = function(){}; }
    </script>

    <!-- Real Natively SDK — async, no splash dependency on its onload anymore. -->
    <script async src="https://cdn.jsdelivr.net/npm/natively@2.20.0/natively-frontend.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Typeform embed loaded on idle so it doesn't delay the WebView's "page loaded" event. -->
    <script>
      (function(){
        function loadTypeform(){
          if (document.getElementById("__tf_embed_script__")) return;
          var s = document.createElement("script");
          s.id = "__tf_embed_script__";
          s.src = "//embed.typeform.com/next/embed.js";
          s.async = true;
          document.head.appendChild(s);
        }
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(loadTypeform, { timeout: 4000 });
        } else {
          setTimeout(loadTypeform, 2500);
        }
      })();
    </script>
  </body>
</html>
