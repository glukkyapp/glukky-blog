<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Glukky</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>html,body{background-color:#F3EAE5;margin:0;padding:0;}#root{background-color:#F3EAE5;min-height:100vh;}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts loaded async so font fetch doesn't block BN's "page loaded" splash dismissal. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Karla:ital,wght@0,200..800;1,200..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=DM+Sans:wght@400..700&display=swap"></noscript>
    <script>if (typeof nativelyOnLoad === "undefined") { window.nativelyOnLoad = function() {}; }</script>
    <script>
      // Capture the wall-clock instant BN considers the page loaded; consumed by the dev-panel cold-launch readout.
      (function(){
        var orig = window.nativelyOnLoad;
        window.nativelyOnLoad = function(){
          window.__bnLoadedAt = Date.now();
          if (typeof orig === "function") orig.apply(this, arguments);
        };
      })();
    </script>
    <script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@2.20.0/natively-frontend.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Typeform embed loaded on idle so it doesn't delay the WebView's "page loaded" event. -->
    <script>
      (function(){
        function loadTypeform(){
          if (document.getElementById("__tf_embed_script__")) return;
          var s = document.createElement("script");
          s.id = "__tf_embed_script__";
          s.src = "//embed.typeform.com/next/embed.js";
          s.async = true;
          document.head.appendChild(s);
        }
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(loadTypeform, { timeout: 4000 });
        } else {
          setTimeout(loadTypeform, 2500);
        }
      })();
    </script>
  </body>
</html>
