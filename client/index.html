<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Glukky</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/loading-label-zh-subset.woff2"
      as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/launch/har-gow-launch.mp4"
      as="video" type="video/mp4">
    <style>
      @font-face {
        font-family: "Glukky Loading Chinese";
        src: url("/fonts/loading-label-zh-subset.woff2") format("woff2");
        font-display: block;
      }
      html, body { background-color: #0D7E8F; margin: 0; padding: 0; }
      #root { background-color: #0D7E8F; }
      #boot-caption {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(2rem + env(safe-area-inset-top))
          calc(2rem + env(safe-area-inset-right))
          calc(2rem + env(safe-area-inset-bottom))
          calc(2rem + env(safe-area-inset-left));
        user-select: none;
        -webkit-user-select: none;
      }
      #boot-loading-video {
        width: 18vw;
        max-width: 112px;
        min-width: 64px;
        height: auto;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        clip-path: circle(40% at 50% 50%);
        background-color: #0D7E8F;
        display: block;
        margin-bottom: 0.75rem;
        opacity: 0;
      }
      #boot-loading-video[data-frame-ready="true"] { opacity: 1; }
      #boot-loading-label {
        color: #FEF2E0;
        font: 1.5rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
        margin: 0;
        max-width: 360px;
        width: 100%;
        text-align: center;
      }
      #boot-loading-label.is-chinese {
        font-family: "Glukky Loading Chinese", serif;
      }
      @keyframes boot-ell-dot {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      .boot-ell-dot { animation: boot-ell-dot 1.2s ease-in-out infinite; }
      .boot-ell-dot-1 { animation-delay: 0s; }
      .boot-ell-dot-2 { animation-delay: 0.4s; }
      .boot-ell-dot-3 { animation-delay: 0.8s; }
      @media (prefers-reduced-motion: reduce) {
        .boot-ell-dot { animation: none; }
      }
    </style>

    <!-- Warm up the third-party origins we'll touch in the first second. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://us.i.posthog.com">
    <link rel="preconnect" href="https://us-assets.i.posthog.com" crossorigin>

    <!--
      Slimmed Google Fonts: only the families/weights actually used in the app shell.
      - Inter / Karla: heading + body (regular, medium, semibold, bold, extrabold, +italic)
      - Playfair Display: only the .app-page-v2 greeting at weight 700
      Mono uses system Menlo (see --font-mono in index.css), so no Google mono is fetched.
    -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Karla:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:wght@700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Karla:wght@400;700&display=swap"></noscript>

    <!-- Real Natively SDK — async, no splash dependency on its onload anymore. -->
    <script async src="https://cdn.jsdelivr.net/npm/natively@2.20.0/natively-frontend.min.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-caption" role="status" aria-live="polite">
        <video
          id="boot-loading-video"
          data-testid="boot-loading-video"
          src="/launch/har-gow-launch.mp4"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          aria-label="Loading"
          onloadeddata="this.dataset.frameReady='true'"
        ></video>
        <p id="boot-loading-label" data-testid="boot-loading-label">Loading<span class="boot-ell-dot boot-ell-dot-1">.</span><span class="boot-ell-dot boot-ell-dot-2">.</span><span class="boot-ell-dot boot-ell-dot-3">.</span></p>
      </div>
    </div>
    <script>
      (function(){
        var preferred = "";
        try { preferred = localStorage.getItem("glukky_preferred_lang") || ""; } catch(e){}
        var lang = preferred || (navigator.language || "");
        var label = document.getElementById("boot-loading-label");
        var video = document.getElementById("boot-loading-video");
        if (label) {
          var isChinese = lang === "zh-Hant" || lang.indexOf("zh") === 0;
          var isCantonese = lang === "yue" || lang.indexOf("yue-") === 0;
          var localizedLabel = (isChinese || isCantonese) ? "載入中" : "Loading";
          label.firstChild.nodeValue = localizedLabel;
          if ((isChinese || isCantonese) && document.fonts) {
            document.fonts
              .load('24px "Glukky Loading Chinese"', localizedLabel)
              .then(function() { label.classList.add("is-chinese"); });
          }
          if (video) video.setAttribute("aria-label", localizedLabel);
        }
      })();
    </script>
    <!--
      BN dismisses its splash when the page calls nativelyOnLoad(). Keep the
      call after the static caption exists so the native-to-React handoff
      never reveals an empty root. React replaces #root's contents on mount.
      The real Natively SDK still loads async for its other bridges.
    -->
    <script>
      (function(){
        window.__bnLoadedAt = Date.now();
        try { if (typeof nativelyOnLoad === "function") nativelyOnLoad(); } catch(e){}
        // Stub so anything else that calls nativelyOnLoad() later is a no-op.
        if (typeof nativelyOnLoad === "undefined") { window.nativelyOnLoad = function(){}; }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
